# Every night: fetch events from all sources, re-check the watchlist, commit
# changed data to main and publish the site. Can also be started by hand
# (Actions → Nightly fetch → Run workflow). The run summary lists which sources
# worked and what the watchlist found.
name: Nightly fetch

on:
  schedule:
    # Off the full/half hour, when GitHub most often delays or drops scheduled runs.
    # 04:17 UTC = 05:17 in Brussels (06:17 in summer); 10:17 UTC is a fallback in case
    # the early run was dropped (it only commits if something changed).
    - cron: '17 4 * * *'
    - cron: '17 10 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: nightly-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      - name: Fetch events and re-check the watchlist
        run: npm run fetch
        env:
          TZ: Europe/Brussels
        # A failing source keeps its previous events; the rest is still published.
        continue-on-error: true

      - name: Commit updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "Update events (nightly)"
          # Someone may have pushed while the fetch was running.
          git pull --rebase origin main
          git push origin HEAD:main

  deploy:
    needs: fetch
    uses: ./.github/workflows/deploy.yml
